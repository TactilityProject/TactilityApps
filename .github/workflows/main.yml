name: Main
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

permissions: read-all

jobs:
  CheckVersionBumps:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: "Check version bumps"
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 Scripts/check-version-bumps.py "origin/$BASE_REF"
  GenerateAppMatrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: set-matrix
        run: python3 Scripts/gh-generate-app-matrix.py
  Build:
    runs-on: ubuntu-latest
    needs: GenerateAppMatrix
    strategy:
      matrix: ${{ fromJSON(needs.GenerateAppMatrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: "Build"
        uses: ./.github/actions/build-app
        with:
          app_name: ${{ matrix.app_name }}
  Bundle:
    runs-on: ubuntu-latest
    needs: [Build]
    outputs:
      sdk_version: ${{ steps.release.outputs.sdk_version }}
    steps:
      - uses: actions/checkout@v4
      - name: "Build"
        id: release
        uses: ./.github/actions/release-apps
  PublishApps:
    runs-on: ubuntu-latest
    needs: [Bundle]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: "Publish Apps"
        env:
          CDN_ID: ${{ secrets.CDN_ID }}
          CDN_TOKEN_NAME: ${{ secrets.CDN_TOKEN_NAME }}
          CDN_TOKEN_VALUE: ${{ secrets.CDN_TOKEN_VALUE }}
        uses: ./.github/actions/publish-apps
        with:
          sdk_version: ${{ needs.Bundle.outputs.sdk_version }}
