description=Offline vector maps from OpenFreeMap, drawn fullscreen with anti-aliased roads, water, parks and buildings.\n\nThe device downloads the area you choose over Wi-Fi and stores the tiles on the SD card, so maps keep working without a connection.\n\nRequires an ESP32-S3 or ESP32-P4 device with 8 MB PSRAM and a FAT-formatted SD card.
requires.ram=8M
