description.short=Offline vector maps
description=High-detail vector maps: get live maps via Wi-Fi, or download them to your SD card before your trip.\n\nFeatures terrain with hillshade and contour lines, an outdoor style for hiking, offline search, and navigation for walking, cycling, and driving with elevation profiles. Waypoints and GPX tracks can be shown or navigated to.\n\nWorks with keyboard, trackball, or touch only. Requires an ESP32-S3 or ESP32-P4 device with at least 8 MB PSRAM.\n\nTested on the LilyGO T-Deck and SeeedStudio Wio Tracker L2 Pro.\n\nMap data provided by OpenFreeMap & OpenStreetMap.
requires.ram=8M
