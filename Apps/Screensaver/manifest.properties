description=Starts a screensaver when the screen was not used for a while, and turns the backlight off after 5 minutes on it.\n\nChoose between a black screen, Bouncing Balls, Mystify, Matrix Rain and StackChan, and set how long the screen has to be idle. Touching the screen brings the display back. The screensaver runs from boot once this package is installed.
