description=Turns the device into a Bluetooth LE media remote with six buttons: previous, play/pause, next, mute, volume down and volume up. It pairs with a host like any other Bluetooth remote and advertises as Tactility Media Keys.\n\nKeyboard control: B previous, P play/pause, N next, M mute, D volume down, U volume up. Q or ESC to exit focus.\n\nButtons are ignored while no host is connected.
