description=GNSS receiver status, like the GPS test apps on Android. It is not a map.\n\nShows the fix, the satellites in view and in use, their signal strength and position in a sky plot, and the position, speed and time.\n\nRequires a device with a GPS receiver and firmware that exports the GPS API to apps.
