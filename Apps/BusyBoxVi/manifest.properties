description=The BusyBox vi text editor, for use from the Terminal app.\n\nRun: vi [-c CMD] [-R] [-H] [FILE]...\n\nSupports colon commands (:w, :q, :wq, :e, :r, :s/old/new/), yank and put, marks, plain-text search, repeat, undo and :set options. Regular expressions, shell commands and suspend are not supported. The terminal has no Home, End, PgUp or PgDn keys: use 0, $, Ctrl+B and Ctrl+F.
