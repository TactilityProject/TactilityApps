description=Digital and analog clock.\n\nSwitch between the two faces with the button in the toolbar. It follows the system 12/24-hour and date format settings and uses the system time, which is synchronized over NTP when Wi-Fi is connected. When the time has not been set, the app offers to open the Wi-Fi settings. The layout adapts to small and large displays.
