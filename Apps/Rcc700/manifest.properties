description=Self-hosting mini C compiler for ESP32 RISC-V devices (a port of xcc700), for use from the Terminal app.\n\nRun: rcc700 FILE.c [-o OUTPUT]\n\nWithout -o, something.c becomes something.elf. The output is a RV32 ELF that can be loaded with the ESP-IDF elf_loader. Supports a small subset of C. Requires PSRAM.
