name=Air Mouse
description.short=Bluetooth tilt air mouse
description=Turns the device into a Bluetooth LE mouse. Rotate the device to move the pointer and tap the two on-screen pads for the left and right buttons. It pairs with a PC, phone or tablet like any other Bluetooth mouse.\n\nThe pointer follows the rotation measured by the gyroscope, so it works the same whether the device is held upright or on its side. Features: automatic calibration, adjustable sensitivity, a settings screen and an optional auto-clutch that freezes the pointer while you reposition the device.\n\nRequires a gyroscope and Bluetooth.
