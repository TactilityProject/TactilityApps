description=Example of an app package that adds hardware. It adds a 2.8 inch ILI9341 SPI panel as a second display and draws a Mystify scene on it, mirrored on the main display.\n\nContains a kernel module with the display driver, the demo app, a settings app with live settings, a dashboard and a terminal command. Meant for developers.
