description=Records 16 kHz, mono, 16-bit WAV audio from the device's microphone and plays it back.\n\nTap a recording to fold out its player beneath the row, with a progress bar, elapsed and total time, and Play, Pause and Stop. Recordings are listed newest-first with their duration, size and date, and can be deleted from the toolbar. Recordings are limited to 5 minutes. The layout follows the Material theme and fills the screen from small 320x240 panels to large landscape displays.
