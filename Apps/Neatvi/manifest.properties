name=Neatvi
description.short=Neatvi text editor
description=The neatvi text editor, for use from the Terminal app.\n\nRun: vi [-v] [-e] [FILE]...\n\nSupports vi and ex commands (:w, :q, :wq, :e, :r, :s/old/new/), regular expression search and substitution, multiple buffers, registers, marks, undo and redo, and syntax highlighting. Shell commands, filters and pipes are not supported. The terminal has no Home, End, PgUp or PgDn keys: use 0, $, Ctrl+B and Ctrl+F.
app.0.id=tactility.neatvi
app.0.name=Neatvi
app.0.binary=vi
app.0.hidden=false
app.0.headless=true
app.0.stack.depth=8192
